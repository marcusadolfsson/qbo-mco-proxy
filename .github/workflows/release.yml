# Builds QBO MCP Proxy (universal), signs it with Developer ID, and notarizes
# and staples both the app and its DMG.
#
# Push a tag like v0.2.0 to publish a GitHub release with the notarized DMG;
# run it by hand (Actions › Release › Run workflow) to get the DMG as an
# artifact without publishing.
#
# Repository secrets (Settings › Secrets and variables › Actions):
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#   KEYCHAIN_PASSWORD           any string; protects the temporary keychain
#   APPLE_ID                    the Apple ID used for notarization
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               ZP8TR4ZYDR
#
# Supply-chain rules this file keeps:
# - Third-party code (Intuit's server and its ~400 npm dependencies) is
#   fetched and built first, with npm install scripts disabled, before the
#   signing certificate or any secret exists in the job.
# - Only GitHub's own actions are used, pinned to exact commits.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # No secrets in this step or before it.
      - name: Build Intuit's server (no install scripts, no secrets)
        run: make server

      - name: Test
        run: make test

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning build.keychain

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Resources/Info.plist

      - name: Build, sign, notarize, staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The server was staged above, so make doesn't run npm again here.
        # $$ keeps make from expanding the variables, so the logged command
        # shows their names, never their values.
        run: |
          make -q .build/qbo-server/stage/VERSION || { echo "Intuit's server would be rebuilt with secrets present; refusing."; exit 1; }
          make notarize 'NOTARY_AUTH=--apple-id "$$APPLE_ID" --team-id "$$APPLE_TEAM_ID" --password "$$APPLE_PASSWORD"'

      - name: Keep the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QBO-MCP-Proxy
          path: dist/QBO-MCP-Proxy.dmg

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/QBO-MCP-Proxy.dmg --title "QBO MCP Proxy $GITHUB_REF_NAME" --generate-notes

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true
